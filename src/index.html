<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>راي لينك للتوريدات — حلول متكاملة للمشتريات والتوريد</title>
  <meta name="description" content="راي لينك للتوريدات — شركة مصرية متخصصة في تقديم حلول متكاملة للمشتريات والتوريد للشركات والمؤسسات والهيئات.">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="/">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Open Graph defaults (Arabic primary) -->
  <meta property="og:locale" content="ar_EG">
  <meta property="og:locale:alternate" content="en_US">
  <meta property="og:type" content="website">
  <meta property="og:title" content="راي لينك للتوريدات — حلول متكاملة للمشتريات والتوريد">
  <meta property="og:description" content="شركة مصرية متخصصة في تقديم حلول متكاملة للمشتريات والتوريد للشركات والمؤسسات والهيئات.">
  <meta property="og:site_name" content="RAI Link Supplies">

  <!-- Preconnect to Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    Inline script: Restore user's language preference from localStorage
    BEFORE Angular bootstraps, preventing any flash of wrong direction/language.
  -->
  <script>
    (function() {
      var lang = localStorage.getItem('rai-lang');
      if (lang === 'en') {
        document.documentElement.lang = 'en';
        document.documentElement.dir = 'ltr';
      }
      // Default is already ar/rtl from the HTML attributes above
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
