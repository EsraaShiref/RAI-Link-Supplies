<section class="about-section py-12 md:py-16 bg-white overflow-hidden">
  <div class="container mx-auto px-4 md:px-8 max-w-7xl">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 lg:gap-12 items-center">

      <!-- Text Column -->
      <div
        appRevealOnScroll
        class="lg:col-span-6 flex flex-col justify-center"
        [class.lg:order-2]="reverse()"
        [class.lg:order-1]="!reverse()"
      >
        <span class="text-brand-orange font-bold tracking-wider uppercase text-xs md:text-sm mb-2 block">
          {{ kickerKey() | translate }}
        </span>

        <h2 class="text-2xl sm:text-3xl font-extrabold text-brand-navy leading-tight mb-4">
          {{ titleKey() | translate }}
        </h2>

        <p class="text-brand-gray text-base leading-relaxed mb-6">
          {{ bodyKey() | translate }}
        </p>

        @if (readMoreRoute()) {
          <div>
            <a [routerLink]="readMoreRoute()" class="btn-solid-orange">
              {{ readMoreLabelKey() | translate }}
            </a>
          </div>
        }
      </div>

      <!-- Unified Image Composition Column -->
      <div
        appRevealOnScroll
        [delay]="150"
        class="lg:col-span-6 relative flex justify-center"
        [class.lg:order-1]="reverse()"
        [class.lg:order-2]="!reverse()"
      >
        <div class="unified-image-container w-full max-w-lg">
          <img
            src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=900&q=80"
            alt="RAI Link Supplies Procurement & Supply"
            class="unified-image shadow-xl"
            loading="lazy"
          />
        </div>
      </div>

    </div>
  </div>
</section>
