<div class="text-center flex flex-col items-center">
  @if (kickerKey()) {
    <span class="text-orange text-sm uppercase tracking-widest font-semibold mb-2">
      {{ kickerKey()! | translate }}
    </span>
  }
  <h2 class="text-navy font-bold text-3xl md:text-4xl">
    {{ titleKey() | translate }}
  </h2>
  <div class="w-16 h-1 bg-orange mt-4 rounded-full"></div>
</div>
