<section class="two-card-section py-10 md:py-14 bg-white">
  <div class="container mx-auto px-4 md:px-8 max-w-7xl">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 lg:gap-8">

      <!-- Card 1: Mission (First in source order, sits at inline-start) -->
      <div
        appRevealOnScroll
        class="card"
      >
        <div class="card-inner">
          <div class="card-title-group mb-4">
            <h3 class="card-title text-xl font-bold text-brand-navy">
              {{ card1().titleKey | translate }}
            </h3>
            <div class="title-underline"></div>
          </div>

          <p class="card-body text-brand-gray text-sm sm:text-base leading-relaxed mb-6">
            {{ card1().bodyKey | translate }}
          </p>

          <div class="card-footer">
            <app-read-more-link [route]="card1().route || '/about'" />
          </div>
        </div>
      </div>

      <!-- Card 2: Vision (Second in source order, sits at inline-end) -->
      <div
        appRevealOnScroll
        [delay]="100"
        class="card"
      >
        <div class="card-inner">
          <div class="card-title-group mb-4">
            <h3 class="card-title text-xl font-bold text-brand-navy">
              {{ card2().titleKey | translate }}
            </h3>
            <div class="title-underline"></div>
          </div>

          <p class="card-body text-brand-gray text-sm sm:text-base leading-relaxed mb-6">
            {{ card2().bodyKey | translate }}
          </p>

          <div class="card-footer">
            <app-read-more-link [route]="card2().route || '/about'" />
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
