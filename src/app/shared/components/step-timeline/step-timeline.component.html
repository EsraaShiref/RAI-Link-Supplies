<div class="relative max-w-5xl mx-auto px-4 py-8">
  <!-- Center Vertical Navy Line (Desktop: centered, Mobile: aligned to start) -->
  <div class="absolute top-0 bottom-0 start-8 md:start-1/2 -translate-x-1/2 w-1 bg-navy/20 -z-10 rounded-full"></div>

  <!-- Steps List -->
  <div class="space-y-12 md:space-y-16">
    @for (step of steps(); track step.number; let i = $index) {
      <div 
        appRevealOnScroll
        [delay]="i * 100"
        class="relative flex flex-col md:flex-row items-start md:items-center"
        [class.md:flex-row-reverse]="i % 2 === 1">
        
        <!-- Content Card Half (50% on desktop) -->
        <div class="w-full md:w-1/2 ps-16 md:ps-0" [class.md:pe-12]="i % 2 === 0" [class.md:ps-12]="i % 2 === 1">
          <div class="bg-white rounded-2xl p-6 sm:p-8 border border-border shadow-sm hover:shadow-lg transition-all duration-300 card-hover relative">
            
            <!-- Step badge for mobile view only -->
            <div class="flex items-center gap-3 mb-3">
              @if (step.icon) {
                <span class="w-9 h-9 rounded-lg bg-orange/10 text-orange flex items-center justify-center text-lg shrink-0">
                  {{ step.icon }}
                </span>
              }
              <span class="text-xs font-bold uppercase tracking-wider text-orange">
                Step 0{{ step.number }}
              </span>
            </div>

            <h3 class="font-bold text-navy text-xl mb-2">
              {{ step.titleKey | translate }}
            </h3>

            <p class="text-text-secondary text-sm leading-relaxed">
              {{ step.bodyKey | translate }}
            </p>
          </div>
        </div>

        <!-- Center Circular Orange Badge (pinned to the vertical line) -->
        <div class="absolute top-6 md:top-auto md:relative start-8 md:start-0 -translate-x-1/2 md:translate-x-0 w-12 h-12 rounded-full bg-orange text-white font-bold text-base flex items-center justify-center shrink-0 shadow-lg border-4 border-white z-10 animate-pop-in">
          {{ step.number }}
        </div>

        <!-- Empty Spacer Half for Desktop Balancing -->
        <div class="hidden md:block w-1/2"></div>

      </div>
    }
  </div>
</div>
