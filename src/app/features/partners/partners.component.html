<!-- 1. PageHeaderBannerComponent -->
<app-page-header-banner
  [titleKey]="'partners.title'"
  [kickerKey]="'nav.partners'"
  [subtitleKey]="'hero.subtitle'" />

<!-- 2. TextWithCollageComponent (Partners & Suppliers narrative) -->
<app-text-with-collage
  [kickerKey]="'partners.kicker'"
  [titleKey]="'partners.title'"
  [bodyKey]="'partners.body'"
  [bullets]="partnerBullets"
  [icon]="'🤝'"
  [collageCardTitleKey]="'partners.title'"
  [collageCardBodyKey]="'partners.body'" />

<!-- 3. CardGridComponent (3 Columns: Target Audience Segments) -->
<app-card-grid
  [kickerKey]="'audience.kicker'"
  [titleKey]="'audience.title'"
  [items]="audiencesList"
  [columns]="3"
  [bgLight]="true" />

<!-- 4. CtaBannerComponent -->
<app-cta-banner
  [messageKey]="'home.ctaBanner.message'"
  [buttonLabelKey]="'home.ctaBanner.button'"
  [route]="'/contact'" />
