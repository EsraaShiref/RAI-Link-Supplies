<main>
  <!-- Page Header -->
  <section class="bg-navy py-16 md:py-24 text-center">
    <div class="container mx-auto px-4">
      <span class="text-orange font-semibold tracking-wider uppercase text-sm mb-4 block animate-fade-up">{{ 'products.kicker' | translate }}</span>
      <h1 class="text-4xl md:text-5xl font-bold text-text-inverse animate-fade-up" style="animation-delay: 100ms">
        {{ 'products.title' | translate }}
      </h1>
    </div>
  </section>

  <!-- Project Scope -->
  <section class="bg-white py-16">
    <div class="container mx-auto px-4">
      <app-section-title titleKey="projectScope.title" kickerKey="projectScope.kicker"></app-section-title>
      <div appRevealOnScroll class="max-w-4xl mx-auto mt-8 text-center text-text-secondary text-lg leading-relaxed">
        <p [innerHTML]="'projectScope.body' | translate"></p>
      </div>
    </div>
  </section>

  <!-- Expertise Areas -->
  <section class="bg-bg-light py-16 md:py-24">
    <div class="container mx-auto px-4">
      <app-section-title titleKey="expertise.title" kickerKey="expertise.kicker"></app-section-title>
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-12">
        @for (area of expertiseAreas; track area.id; let i = $index) {
          <div appRevealOnScroll [style.animation-delay]="i * 100 + 'ms'">
            <app-card [titleKey]="area.titleKey" [bodyKey]="area.bodyKey" [icon]="area.icon"></app-card>
          </div>
        }
      </div>
    </div>
  </section>

  <!-- Product Categories -->
  <section class="bg-white py-16 md:py-24">
    <div class="container mx-auto px-4">
      <app-section-title titleKey="products.title" kickerKey="products.kicker"></app-section-title>
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 mt-12">
        @for (product of products; track product.id; let i = $index) {
          <div appRevealOnScroll [style.animation-delay]="i * 100 + 'ms'">
            <app-card [titleKey]="product.titleKey" [bodyKey]="product.bodyKey" [icon]="product.icon"></app-card>
          </div>
        }
      </div>
    </div>
  </section>

  <!-- CTA Banner -->
  <app-cta-banner messageKey="home.ctaBanner.message" buttonLabelKey="home.ctaBanner.button" route="/contact"></app-cta-banner>
</main>
