<!-- 1. PageHeaderBannerComponent -->
<app-page-header-banner
  [titleKey]="'products.title'"
  [kickerKey]="'nav.products'"
  [subtitleKey]="'hero.subtitle'" />

<!-- 2. TextWithCollageComponent (Project Scope) -->
<app-text-with-collage
  [kickerKey]="'projectScope.kicker'"
  [titleKey]="'projectScope.title'"
  [bodyKey]="'projectScope.body'"
  [bullets]="scopeBullets"
  [icon]="'⚙️'"
  [collageCardTitleKey]="'expertise.title'"
  [collageCardBodyKey]="'expertise.general.body'" />

<!-- 3. NumberedDarkBandComponent (3 Expertise Areas) -->
<app-numbered-dark-band
  [kickerKey]="'expertise.kicker'"
  [titleKey]="'expertise.title'"
  [items]="expertiseItems" />

<!-- 4. CardGridComponent (7 Product Categories) -->
<app-card-grid
  [kickerKey]="'products.kicker'"
  [titleKey]="'products.title'"
  [items]="productCategories"
  [columns]="4"
  [bgLight]="true"
  [defaultRoute]="'/contact'" />
