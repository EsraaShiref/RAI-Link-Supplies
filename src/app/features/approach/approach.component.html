<!-- 1. PageHeaderBannerComponent -->
<app-page-header-banner
  [titleKey]="'whyus.title'"
  [kickerKey]="'nav.approach'"
  [subtitleKey]="'hero.subtitle'" />

<!-- 2. IconListWithImageComponent (Full 5 Why-Us items) -->
<app-icon-list-with-image
  [kickerKey]="'whyus.kicker'"
  [titleKey]="'whyus.title'"
  [items]="whyUsFullList"
  [badgeTextKey]="'approach.badge'"
  [badgeSubKey]="'approach.badgeSub'"
  [bgLight]="false" />

<!-- 3. StepTimelineComponent (6-step How We Work alternating timeline) -->
<section class="py-16 md:py-24 bg-bg-light">
  <div class="container mx-auto px-4 md:px-8 max-w-7xl">
    <app-section-title 
      [titleKey]="'howwework.title'" 
      [kickerKey]="'howwework.kicker'" />

    <app-step-timeline [steps]="steps" />
  </div>
</section>

<!-- 4. CtaBannerComponent -->
<app-cta-banner
  [messageKey]="'home.ctaBanner.message'"
  [buttonLabelKey]="'home.ctaBanner.button'"
  [route]="'/contact'" />
