<!-- 1. Hero Section (Full-bleed, dark navy gradient overlay, dual CTAs) -->
<section class="relative min-h-[82vh] md:min-h-[90vh] flex items-center bg-navy text-text-inverse overflow-hidden">
  <app-decorative-ornament [type]="'dots'" [position]="'top-end'" />
  
  <!-- Background Atmospheric Gradient & Grid Texture -->
  <div class="absolute inset-0 bg-gradient-to-t md:bg-gradient-to-tr from-navy via-navy/95 to-navy/75 z-0"></div>
  <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#EC6B2A_1px,transparent_1px)] [background-size:24px_24px] pointer-events-none z-0"></div>
  <div class="absolute -bottom-32 -end-32 w-96 h-96 bg-orange/20 rounded-full blur-3xl pointer-events-none z-0 animate-ambient-drift"></div>
  <div class="absolute -top-32 -start-32 w-96 h-96 bg-red-orange/15 rounded-full blur-3xl pointer-events-none z-0"></div>

  <!-- Hero Content -->
  <div class="container relative z-10 mx-auto px-4 md:px-8 max-w-7xl py-16 md:py-24">
    <div class="max-w-3xl">
      
      <!-- Eyebrow Badge -->
      <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/10 border border-white/20 text-orange font-semibold text-xs tracking-wider uppercase mb-6 animate-fade-up">
        <span class="w-2 h-2 rounded-full bg-orange animate-pulse"></span>
        <span>{{ 'hero.subtitle' | translate }}</span>
      </div>

      <!-- Main Headline (2-3 lines) -->
      <h1 class="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold tracking-tight text-white leading-tight mb-6 animate-fade-up" style="animation-delay: 150ms">
        {{ 'hero.title' | translate }}
      </h1>

      <!-- Subtext -->
      <p class="text-lg sm:text-xl text-text-inverse/80 font-normal leading-relaxed mb-10 max-w-2xl animate-fade-up" style="animation-delay: 250ms">
        {{ 'about.body' | translate }}
      </p>

      <!-- Dual CTA Buttons: Solid Orange + Outline White -->
      <div class="flex flex-wrap items-center gap-4 animate-fade-up" style="animation-delay: 350ms">
        <!-- Primary Solid Orange CTA (Request a Quote / Contact) -->
        <a 
          routerLink="/contact"
          class="inline-flex items-center justify-center bg-orange hover:bg-red-orange text-white font-semibold text-base px-8 py-4 rounded-xl shadow-lg hover:shadow-orange/30 transition-all duration-200 transform hover:-translate-y-0.5">
          {{ 'hero.quoteCta' | translate }}
        </a>

        <!-- Secondary Outline White CTA (Learn More / About) -->
        <a 
          routerLink="/about"
          class="inline-flex items-center justify-center border-2 border-white/40 hover:border-white text-white hover:bg-white/10 font-semibold text-base px-8 py-4 rounded-xl transition-all duration-200">
          {{ 'hero.learnMore' | translate }}
        </a>
      </div>

    </div>
  </div>

  <!-- Subtle bottom edge decorative wave/divider -->
  <div class="absolute bottom-0 inset-x-0 h-4 bg-gradient-to-r from-orange via-red-orange to-navy"></div>
</section>

<!-- 2. TextWithCollageComponent (About preview + Read More -> /about) -->
<app-text-with-collage
  [kickerKey]="'about.kicker'"
  [titleKey]="'about.title'"
  [bodyKey]="'home.aboutPreview.body'"
  [secondaryBodyKey]="'goals.goal1'"
  [readMoreRoute]="'/about'"
  [readMoreLabelKey]="'home.aboutPreview.cta'"
  [icon]="'🏢'"
  [collageCardTitleKey]="'hero.title'"
  [collageCardBodyKey]="'mission.body'" />

<!-- 3. TwoCardRowComponent (Mission & Vision condensed) -->
<app-two-card-row
  [card1]="missionCard"
  [card2]="visionCard"
  [sectionTitleKey]="'values.title'"
  [sectionKickerKey]="'values.kicker'"
  [bgLight]="true" />

<!-- 4. CollageBannerComponent (Decorative photographic transition band) -->
<app-collage-banner />

<!-- 5. NumberedDarkBandComponent (3 Expertise areas: General, IT/Electronics, Specialized) -->
<app-numbered-dark-band
  [kickerKey]="'expertise.kicker'"
  [titleKey]="'expertise.title'"
  [items]="expertiseItems" />

<!-- 6. IconListWithImageComponent (Why Choose Us condensed preview -> /approach) -->
<app-icon-list-with-image
  [kickerKey]="'whyus.kicker'"
  [titleKey]="'whyus.title'"
  [items]="whyUsCondensed"
  [readMoreRoute]="'/approach'"
  [readMoreLabelKey]="'common.learnMore'"
  [bgLight]="true" />

<!-- 7. CtaBannerComponent (Contact Us CTA band) -->
<app-cta-banner
  [messageKey]="'home.ctaBanner.message'"
  [buttonLabelKey]="'home.ctaBanner.button'"
  [route]="'/contact'" />
