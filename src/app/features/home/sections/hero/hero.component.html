<!-- Hero Section — full-bleed background, dark overlay, staggered text animation -->
<section class="hero" @fadeUp>
  <!-- Background image + gradient overlay are in CSS -->
  <div class="hero__overlay"></div>

  <div class="hero__content">
    <h1 class="hero__headline animate-item">
      {{ 'HERO.HEADLINE' | translate }}
    </h1>
    <p class="hero__subtext animate-item">
      {{ 'HERO.SUBTEXT' | translate }}
    </p>
    <div class="hero__actions animate-item">
      <a routerLink="/contact" class="hero__btn hero__btn--primary">
        {{ 'HERO.CTA_PRIMARY' | translate }}
      </a>
      <a routerLink="/about" class="hero__btn hero__btn--secondary">
        {{ 'HERO.CTA_SECONDARY' | translate }}
      </a>
    </div>
  </div>
</section>
