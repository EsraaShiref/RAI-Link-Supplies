<!-- 1. PageHeaderBannerComponent -->
<app-page-header-banner
  [titleKey]="'about.title'"
  [kickerKey]="'about.kicker'"
  [subtitleKey]="'hero.subtitle'" />

<!-- 2. TextWithCollageComponent (Full About Narrative) -->
<app-text-with-collage
  [kickerKey]="'about.kicker'"
  [titleKey]="'about.title'"
  [bodyKey]="'about.body'"
  [secondaryBodyKey]="'goals.goal1'"
  [bullets]="aboutBullets"
  [icon]="'🏢'"
  [collageCardTitleKey]="'mission.title'"
  [collageCardBodyKey]="'mission.body'" />

<!-- 3. TwoCardRowComponent (Mission + Vision full) -->
<app-two-card-row
  [card1]="missionCard"
  [card2]="visionCard"
  [bgLight]="true" />

<!-- 4. CardGridComponent (4 Values) -->
<app-card-grid
  [kickerKey]="'values.kicker'"
  [titleKey]="'values.title'"
  [items]="valuesList"
  [columns]="4"
  [bgLight]="false" />

<!-- 5. NumberedDarkBandComponent (3 Goals) -->
<app-numbered-dark-band
  [kickerKey]="'goals.kicker'"
  [titleKey]="'goals.title'"
  [items]="goalsItems" />
