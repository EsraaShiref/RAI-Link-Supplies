<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" fill="none">
  <!-- Mark / Symbol -->
  <g id="logo-mark" transform="translate(4, 6)">
    <!-- Hexagonal Base in Pure White for Navy contrast -->
    <path d="M24 2 L42 12 L42 36 L24 46 L6 36 L6 12 Z" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" fill="none" />
    
    <!-- Dynamic Supply Link Accent in Vibrant Orange & Red-Orange -->
    <path d="M14 24 L24 16 L34 24 L24 32 Z" fill="#EC6B2A" />
    <path d="M24 16 L34 24 L31 27 L24 21 Z" fill="#E8322C" opacity="0.9" />
    
    <!-- Central connecting node -->
    <circle cx="24" cy="24" r="3.5" fill="#FFFFFF" />
    <path d="M12 15 L24 8 L36 15" stroke="#EC6B2A" stroke-width="3" stroke-linecap="round" fill="none" />
    <path d="M12 33 L24 40 L36 33" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Wordmark Text -->
  <g id="wordmark" transform="translate(62, 10)">
    <!-- RAI in Pure White -->
    <text x="0" y="28" font-family="'Poppins', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" letter-spacing="1">RAI</text>
    
    <!-- LINK in Vibrant Orange -->
    <text x="56" y="28" font-family="'Poppins', sans-serif" font-weight="600" font-size="28" fill="#EC6B2A" letter-spacing="0.5">LINK</text>
    
    <!-- SUPPLIES in Soft Light Gray for high contrast on Navy -->
    <text x="2" y="42" font-family="'Inter', sans-serif" font-weight="500" font-size="10.5" fill="#EDEEF6" letter-spacing="3.8">SUPPLIES</text>
  </g>
</svg>
